<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b3f" />
    <title>スペース宝石キャッチ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="スペース宝石キャッチ">
      <section class="hud" aria-live="polite">
        <div class="hud-card"><span>スコア</span><strong id="score">0</strong></div>
        <div class="hud-card"><span>のこり</span><strong id="time">45</strong></div>
        <div class="hud-card"><span>ベスト</span><strong id="best">0</strong></div>
      </section>

      <canvas id="game" width="360" height="640" aria-label="ゲーム画面"></canvas>

      <section id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">スマホであそべる</p>
          <h1>スペース宝石キャッチ</h1>
          <p>
            ロケットを指で左右に動かして、キラキラ宝石を集めよう！
            隕石に当たるとスコアが減るよ。
          </p>
          <ul>
            <li>💎 宝石: +10点</li>
            <li>⭐ レアスター: +25点</li>
            <li>☄️ 隕石: -15点</li>
          </ul>
          <button id="startButton" type="button">ゲームスタート</button>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
